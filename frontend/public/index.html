<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ClassBridge" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png" />
    <title>%WEB_TITLE%</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* Prevent default browser focus outline box rings on web */
      *,
      *:focus,
      *:active {
        outline: none !important;
        box-shadow: none !important;
      }
      /* Prevent square missing-glyph box fallbacks while vector icon fonts load */
      @font-face { font-family: 'Ionicons'; font-display: block; }
      @font-face { font-family: 'MaterialIcons'; font-display: block; }
      @font-face { font-family: 'MaterialCommunityIcons'; font-display: block; }
      @font-face { font-family: 'FontAwesome'; font-display: block; }
      @font-face { font-family: 'Feather'; font-display: block; }
      @font-face { font-family: 'Entypo'; font-display: block; }
      @font-face { font-family: 'AntDesign'; font-display: block; }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').then(function(reg) {
            reg.onupdatefound = function() {
              var installingWorker = reg.installing;
              if (installingWorker) {
                installingWorker.onstatechange = function() {
                  if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    console.log('[App] New version deployed! Reloading for update...');
                    window.location.reload();
                  }
                };
              }
            };
          }).catch(function(e) {
            console.log('[SW] Registration failed:', e);
          });
        });
      }
    </script>
  </body>
</html>
